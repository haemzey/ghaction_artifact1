[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghaction-artifact1"
version = "0.1.0"
description = "Flask application for GitHub Actions practice"
requires-python = ">=3.12"
dependencies = [
    "Flask",
]

[tool.setuptools]
py-modules = ["app"]