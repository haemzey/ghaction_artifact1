services:

  db:
    image: mysql:8.4

    container_name: mydbsql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurant_management
      MYSQL_USER: admin
      MYSQL_PASSWORD: root

    networks:
      - mynetwork

    ports:
      - "3306:3306"

    volumes:
      - myvolume:/var/lib/mysql

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    image: python:3.12
    build:
      context: .
    container_name: myflaskserver
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mynetwork
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  mynetwork:
    driver: bridge

volumes:
  myvolume:

  
    
